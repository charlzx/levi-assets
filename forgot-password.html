<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <meta charset="utf-8" />
    <title>Forgot Password?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    
    <!-- CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link class="main-stylesheet" href="css/pages.css" rel="stylesheet" type="text/css" />
    
    <!-- Favicons -->
    <link rel="shortcut icon" href="images/favicon.ico">
    
  </head>

  <body class="fixed-header ">
    <div class="login-wrapper ">
      <div class="bg-pic">
        <img src="images/company5-sectionbg1.jpg" class="lazy">
        
        <div class="bg-caption pull-bottom sm-pull-bottom text-white p-l-20 m-b-20">
          <h2 class="semi-bold text-white">Login to your account</h2>
          <p>Haven't Registered? &nbsp;<a href="register.html" style="color: #2a54bf; text-decoration: underline;">Click Here.</a></p>
        </div>
      </div>
      
      <div class="login-container bg-white">
        <div class="p-l-50 m-l-20 p-r-50 m-r-20 p-t-50 m-t-30 sm-p-l-15 sm-p-r-15 sm-p-t-40">
          <a href="index.html" ><img src="images/company5.png" alt="logo" style="margin-bottom: 40px; height: 75px;"></a>
          
          <form id="form-login" class="p-t-15"> 
            <h3>Enter your Email</h3>
            <div class="form-group form-group-default">
              <label>Email</label>
              <div class="controls">
                <input type="text" name="username" id="email" placeholder="user@email.com" class="form-control" required>
              </div>
            </div>

            <div class="d-flex align-items-center justify-content-end" style="padding: 0;">
            <a href="login.html" class="text-info small">Back to Login &RightArrow;</a>
            </div>

            <button class="btn m-t-10" id="login-btn" style="background-color: #2a54bf; color: #ffffff;" type="submit">Send Verification Code</button>
          </form>
        </div>
      </div>
    </div>
    
</body>
</html>
