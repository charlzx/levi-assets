<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <meta charset="utf-8" />
    <title>Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    
    <!-- CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link class="main-stylesheet" href="css/pages.css" rel="stylesheet" type="text/css" />
   
    <!-- Favicons -->
    <link rel="shortcut icon" href="images/favicon.ico">

  </head>
  <body class="fixed-header ">
    <div class="register-container full-height sm-p-t-30">
      <div class="d-flex justify-content-center flex-column full-height ">
        <a href="index.html"><img src="images/company5.png" alt="logo" style="margin-bottom: 20px; height: 75px;"></a>
        <h3>Create an Account</h3>

        <form id="form-register" class="p-t-15">
          <div class="row">
            <div class="col-md-6">
              <div class="form-group form-group-default">
                <label>Firstname</label>
                <input type="text" autocomplete="off" id="fname" name="fname" placeholder="John" class="form-control" required>
              </div>
            </div>
            <div class="col-md-6">
             <div class="form-group form-group-default">
               <label>Lastname</label>
               <input type="text" autocomplete="off" id="lname" name="lname" placeholder="Doe" class="form-control" required>
             </div>
            </div>
          </div>
         
          <div class="row">
            <div class="col-md-12">
              <div class="form-group form-group-default">
                <label>Email</label>
                <input type="email" autocomplete="off" name="email" id="email" placeholder="user@email.com" class="form-control" required>
              </div>
            </div>
          </div>
          
          <div class="row">
            <div class="col-md-12">
              <div class="form-group form-group-default">
                <label>Password</label>
                <input type="password" name="pass" id="pass" placeholder="Minimum of 4 Charactors" class="form-control" required>
              </div>
            </div>
          </div>
          
          <div class="row">
            <div class="col-md-12">
              <div class="form-group form-group-default">
                <label>Referal code</label>
                <input type="text" class="form-control">
              </div>
            </div>
          </div>

          <div class="row m-t-10">
            <div class="col-lg-12 text-right">
              <a href="login.html" class="text-info small">Already have an account?</a>
            </div>
          </div>
          <button class="btn btn-primary btn-cons m-t-10" id="register-btn" style="background-color: #2a54bf; color: #ffffff;" type="submit">Create a new account</button>
        </form>
      </div>
    </div>
  </body>
</html>
